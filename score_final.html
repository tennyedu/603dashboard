<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>603班 期末評量成績查詢</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=DM+Mono:wght@400;500&display=swap');
  :root {
    --ink:#1a1208;--paper:#fdf8f0;--warm:#f5ede0;
    --gold:#c9921a;--gold-light:#e8b84b;
    --red:#b83232;--green:#2d6a4f;
    --rule:#d4c4a8;--shadow:rgba(26,18,8,0.12);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);font-family:'Noto Serif TC',serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 20px 80px;position:relative;overflow-x:hidden;}
  body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(var(--rule) 1px,transparent 1px),linear-gradient(90deg,var(--rule) 1px,transparent 1px);background-size:40px 40px;opacity:0.3;pointer-events:none;}
  .header{text-align:center;margin-bottom:48px;}
  .header-badge{display:inline-block;background:var(--gold);color:white;font-size:11px;letter-spacing:3px;padding:4px 14px;margin-bottom:16px;font-family:'DM Mono',monospace;}
  .header h1{font-size:clamp(28px,5vw,44px);font-weight:700;line-height:1.2;letter-spacing:-0.5px;}
  .header h1 span{color:var(--gold);}
  .header-sub{margin-top:10px;font-size:13px;color:#7a6a50;letter-spacing:1px;}
  .divider{width:60px;height:3px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:20px auto 0;}
  .search-card{background:white;border:1px solid var(--rule);border-radius:4px;padding:32px 36px;width:100%;max-width:480px;box-shadow:0 4px 24px var(--shadow),0 1px 0 var(--gold-light);margin-bottom:36px;position:relative;}
  .search-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--gold),var(--gold-light),var(--gold));border-radius:4px 4px 0 0;}
  .search-label{display:block;font-size:12px;letter-spacing:2px;color:#7a6a50;margin-bottom:12px;}
  .search-row{display:flex;gap:10px;}
  .search-input{flex:1;border:1.5px solid var(--rule);border-radius:3px;padding:12px 16px;font-family:'DM Mono',monospace;font-size:18px;letter-spacing:2px;color:var(--ink);background:var(--paper);transition:border-color 0.2s;outline:none;}
  .search-input:focus{border-color:var(--gold);background:white;}
  .search-input::placeholder{color:#c4b49a;font-size:14px;letter-spacing:1px;}
  .search-btn{background:var(--gold);color:white;border:none;border-radius:3px;padding:12px 22px;font-family:'Noto Serif TC',serif;font-size:15px;font-weight:600;cursor:pointer;transition:background 0.2s,transform 0.1s;white-space:nowrap;}
  .search-btn:hover{background:#b07e12;}
  .search-btn:active{transform:scale(0.97);}
  .hint{margin-top:14px;font-size:12px;color:#a89878;font-family:'DM Mono',monospace;}
  .result-card{background:white;border:1px solid var(--rule);border-radius:4px;width:100%;max-width:560px;box-shadow:0 6px 32px var(--shadow);overflow:hidden;animation:slideUp 0.35s ease;}
  @keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
  .result-header{background:var(--ink);color:white;padding:20px 28px;display:flex;align-items:center;justify-content:space-between;}
  .student-info h2{font-size:22px;font-weight:700;letter-spacing:1px;}
  .student-meta{font-family:'DM Mono',monospace;font-size:12px;color:#c4b49a;margin-top:4px;letter-spacing:1px;}
  .rank-badge{text-align:center;}
  .rank-num{font-family:'DM Mono',monospace;font-size:42px;font-weight:500;color:var(--gold-light);line-height:1;}
  .rank-label{font-size:11px;color:#a89878;letter-spacing:2px;margin-top:2px;}
  .scores-section{padding:24px 28px;}
  .section-title{font-size:11px;letter-spacing:3px;color:#7a6a50;margin-bottom:16px;display:flex;align-items:center;gap:10px;}
  .section-title::after{content:'';flex:1;height:1px;background:var(--rule);}
  .score-row{display:flex;align-items:center;padding:10px 0;border-bottom:1px solid #f0e8d8;}
  .score-row:last-child{border-bottom:none;}
  .score-subject{font-size:14px;font-weight:600;width:80px;flex-shrink:0;}
  .score-bar-wrap{flex:1;height:8px;background:#f0e8d8;border-radius:4px;overflow:hidden;margin:0 16px;}
  .score-bar{height:100%;border-radius:4px;transition:width 0.6s ease;}
  .score-val{font-family:'DM Mono',monospace;font-size:15px;font-weight:500;width:52px;text-align:right;}
  .total-row{margin-top:20px;background:var(--warm);border:1px solid var(--rule);border-radius:4px;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;}
  .total-label{font-size:13px;font-weight:600;letter-spacing:1px;color:#5a4a30;}
  .total-val{font-family:'DM Mono',monospace;font-size:20px;font-weight:500;color:var(--gold);}
  .avg-row{margin-top:8px;display:flex;justify-content:space-between;align-items:center;padding:0 4px;}
  .avg-label{font-size:12px;color:#7a6a50;}
  .avg-val{font-family:'DM Mono',monospace;font-size:14px;color:#7a6a50;}
  .compare-section{padding:16px 28px 24px;border-top:1px solid var(--rule);background:var(--paper);}
  .compare-row{display:flex;align-items:center;gap:12px;margin-bottom:8px;font-size:13px;}
  .compare-label{width:72px;color:#7a6a50;flex-shrink:0;}
  .compare-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .error-msg{background:#fff5f5;border:1px solid #f5c6c6;border-radius:4px;padding:16px 20px;color:var(--red);font-size:14px;text-align:center;width:100%;max-width:480px;animation:slideUp 0.3s ease;}
  .hidden{display:none;}
  .footer{margin-top:60px;font-size:11px;color:#c4b49a;letter-spacing:2px;font-family:'DM Mono',monospace;}
</style>
</head>
<body>
<div class="header">
  <div class="header-badge">YONGPING ELEMENTARY</div>
  <h1>六〇三班<span>期末評量</span></h1>
  <p class="header-sub">114學年度 第二學期</p>
  <div class="divider"></div>
</div>
<div class="search-card">
  <label class="search-label" for="sid-input">請輸入孩子的學號</label>
  <div class="search-row">
    <input id="sid-input" class="search-input" type="text" placeholder="例：109000" maxlength="10" autocomplete="off"/>
    <button class="search-btn" onclick="lookup()">查詢</button>
  </div>
  <p class="hint">⚠️ 僅限家長使用，請查詢自己孩子的成績</p>
</div>
<div id="error-area" class="hidden"></div>
<div id="result-area" class="hidden"></div>
<div class="footer">603 HOMEROOM · 期末評量成績系統</div>
<script>
const students = [
  {seat:1, sid:'109379',name:'余相羽', chi:91.69,eng:95.6, mat:96.85,soc:98.6, sci:93.25,total:477,   rank:4 },
  {seat:2, sid:'109151',name:'廖宥誠',award:'進步獎',improve:29.5, chi:95.1, eng:92.6, mat:95.05,soc:97.6, sci:92.75,total:476,   rank:5 },
  {seat:3, sid:'109382',name:'彭致皓', chi:97.19,eng:95.8, mat:96.6, soc:98,   sci:94.75,total:488,   rank:1 },
  {seat:4, sid:'109225',name:'邢堉瑋', chi:96.41,eng:95.8, mat:97.4, soc:98.6, sci:90.75,total:487.5, rank:2 },
  {seat:5, sid:'109176',name:'潘韋辰', chi:93.22,eng:94.4, mat:92.6, soc:97,   sci:94.5, total:467,   rank:7 },
  {seat:6, sid:'109079',name:'張品維', chi:88.03,eng:93.8, mat:88.25,soc:96.8, sci:85.25,total:455,   rank:12},
  {seat:7, sid:'109003',name:'鄧臣恩', chi:90.94,eng:92.8, mat:92.45,soc:93.2, sci:81.5, total:445,   rank:14},
  {seat:8, sid:'109006',name:'歐其諺', chi:73,   eng:74,   mat:79.88,soc:89.4, sci:73.5, total:390.75,rank:17},
  {seat:9, sid:'109232',name:'周威辰', chi:35.47,eng:44,   mat:19.4, soc:70.8, sci:50.5, total:186,   rank:21},
  {seat:10,sid:'109111',name:'張晏綸', chi:92.28,eng:88,   mat:94.6, soc:94.8, sci:92.5, total:466,   rank:8 },
  {seat:11,sid:'109013',name:'許展銘', chi:79.41,eng:68.6, mat:73,   soc:79.4, sci:69,   total:331,   rank:19},
  {seat:12,sid:'109260',name:'張亦程', chi:88.41,eng:94.4, mat:90.75,soc:95,   sci:89.5, total:454,   rank:13},
  {seat:13,sid:'109288',name:'朱一',   chi:82.38,eng:88.8, mat:79.55,soc:96,   sci:85,   total:428.5, rank:16},
  {seat:14,sid:'109297',name:'陳佳安', chi:97.32,eng:98,   mat:95.6, soc:98.8, sci:94.25,total:482,   rank:3 },
  {seat:15,sid:'109097',name:'楊媛安',award:'進步獎',improve:30.0, chi:92.03,eng:77.2, mat:87.85,soc:96.8, sci:87.5, total:456,   rank:11},
  {seat:16,sid:'109346',name:'孫苡萱',award:'進步獎',improve:58.0, chi:80.07,eng:66,   mat:27.4, soc:92.2, sci:77.25,total:326.5, rank:20},
  {seat:17,sid:'109272',name:'馬靖耘', chi:94.57,eng:91.2, mat:93.85,soc:97.6, sci:93.5, total:472,   rank:6 },
  {seat:18,sid:'109423',name:'洪書琳', chi:97.5, eng:97.4, mat:94.6, soc:97.6, sci:91.25,total:464,   rank:9 },
  {seat:19,sid:'109301',name:'楊宛霓', chi:97.94,eng:98.2, mat:95.55,soc:98.6, sci:97,   total:488,   rank:1 },
  {seat:20,sid:'109248',name:'許芷瑄',award:'進步獎',improve:87.5, chi:72.53,eng:62.4, mat:62.55,soc:96,   sci:78.75,total:354.5, rank:18},
  {seat:21,sid:'109251',name:'劉芊妤', chi:93.07,eng:96,   mat:96.3, soc:98,   sci:96.5, total:477,   rank:4 },
  {seat:22,sid:'109149',name:'柯瓔芮', chi:96.72,eng:87.2, mat:95,   soc:98.2, sci:94,   total:472,   rank:6 },
  {seat:23,sid:'109174',name:'高喬亘', chi:94.63,eng:87.8, mat:90.9, soc:97.6, sci:87.75,total:458,   rank:10},
  {seat:24,sid:'109277',name:'陳巧庭',award:'進步獎',improve:48.0, chi:91.57,eng:88,   mat:82.35,soc:96.4, sci:79.5, total:431.5, rank:15},
];
const classAvg={
  chi:(students.reduce((s,st)=>s+st.chi,0)/students.length),
  eng:(students.reduce((s,st)=>s+st.eng,0)/students.length),
  mat:(students.reduce((s,st)=>s+st.mat,0)/students.length),
  soc:(students.reduce((s,st)=>s+st.soc,0)/students.length),
  sci:(students.reduce((s,st)=>s+st.sci,0)/students.length),
  total:(students.reduce((s,st)=>s+st.total,0)/students.length),
};
function barColor(v){return v>=85?'#2d6a4f':v>=60?'#c9921a':'#b83232';}
function rankSuffix(n){return n===1?'🥇':n===2?'🥈':n===3?'🥉':'';}
function lookup(){
  const q=document.getElementById('sid-input').value.trim();
  const errArea=document.getElementById('error-area');
  const resArea=document.getElementById('result-area');
  errArea.classList.add('hidden');resArea.classList.add('hidden');
  errArea.innerHTML='';resArea.innerHTML='';
  if(!q)return;
  const s=students.find(st=>st.sid===q);
  if(!s){
    errArea.innerHTML=`<div class="error-msg">找不到學號「${q}」的資料，請確認學號是否正確。</div>`;
    errArea.classList.remove('hidden');return;
  }
  const subs=[
    {label:'國語',val:s.chi,avg:classAvg.chi},
    {label:'英語',val:s.eng,avg:classAvg.eng},
    {label:'數學',val:s.mat,avg:classAvg.mat},
    {label:'社會',val:s.soc,avg:classAvg.soc},
    {label:'自然',val:s.sci,avg:classAvg.sci},
  ];
  const scoreRows=subs.map(sub=>{
    const c=barColor(sub.val);
    return `<div class="score-row">
      <div class="score-subject">${sub.label}</div>
      <div class="score-bar-wrap"><div class="score-bar" style="width:${sub.val}%;background:${c}"></div></div>
      <div class="score-val" style="color:${c}">${sub.val.toFixed(2)}</div>
    </div>`;
  }).join('');
  const compareRows=subs.map(sub=>{
    const diff=(sub.val-sub.avg).toFixed(2);
    const up=parseFloat(diff)>=0;
    return `<div class="compare-row">
      <span class="compare-label">${sub.label}</span>
      <div class="compare-dot" style="background:${up?'#2d6a4f':'#b83232'}"></div>
      <span style="font-family:'DM Mono',monospace;font-size:13px;color:${up?'#2d6a4f':'#b83232'}">${up?'+':''}${diff} 較班平均</span>
    </div>`;
  }).join('');
  const td=(s.total-classAvg.total).toFixed(1);
  const tu=parseFloat(td)>=0;
  resArea.innerHTML=`<div class="result-card">
    <div class="result-header">
      <div class="student-info">
        <h2>${s.name} ${rankSuffix(s.rank)}${s.award?` <span style="font-size:14px;background:#e8b84b;color:#1a1208;padding:2px 8px;border-radius:3px;font-weight:600;letter-spacing:1px">🌟 ${s.award}</span>`:''}</h2>
        <div class="student-meta">學號 ${s.sid}</div>
      </div>
      <div class="rank-badge">
        <div class="rank-num">${s.rank}</div>
        <div class="rank-label">班級排名</div>
      </div>
    </div>
    <div class="scores-section">
      <div class="section-title">各科成績</div>
      ${scoreRows}
      <div class="total-row">
        <span class="total-label">總分</span>
        <span class="total-val">${s.total}</span>
      </div>
      <div class="avg-row">
        <span class="avg-label">總平均</span>
        <span class="avg-val">${(s.total/5).toFixed(2)}</span>
      </div>
    </div>
    <div class="compare-section">
      <div class="section-title">與班平均比較</div>
      ${compareRows}
      <div class="compare-row" style="margin-top:10px;padding-top:10px;border-top:1px solid #e8dcc8">
        <span class="compare-label">總分</span>
        <div class="compare-dot" style="background:${tu?'#2d6a4f':'#b83232'}"></div>
        <span style="font-family:'DM Mono',monospace;font-size:13px;color:${tu?'#2d6a4f':'#b83232'}">${tu?'+':''}${td} 較班平均（${classAvg.total.toFixed(1)}）</span>
      </div>
    ${s.award?`<div style="margin:0 28px 20px;background:linear-gradient(135deg,#fdf3e0,#fff8ec);border:1px solid #e8b84b;border-radius:6px;padding:14px 18px;display:flex;align-items:center;gap:12px">
      <div style="font-size:24px">🌟</div>
      <div>
        <div style="font-size:12px;letter-spacing:2px;color:#7a6a50;margin-bottom:3px">特別表現</div>
        <div style="font-size:15px;font-weight:700;color:#c9921a">進步獎</div>
        <div style="font-size:12px;color:#7a6a50;margin-top:2px">比期中評量進步了 <span style="font-family:'DM Mono',monospace;font-weight:700;color:#c9921a">+${s.improve}</span> 分，繼續保持！</div>
      </div>
    </div>`:''}
  </div>`;

  resArea.classList.remove('hidden');
}
document.getElementById('sid-input').addEventListener('keydown',e=>{if(e.key==='Enter')lookup();});
</script>
</body>
</html>
