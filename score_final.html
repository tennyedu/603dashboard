<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>603班 期末評量成績查詢</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=DM+Mono:wght@400;500&display=swap');
:root{--ink:#1a1208;--paper:#fdf8f0;--warm:#f5ede0;--gold:#c9921a;--gold-light:#e8b84b;--red:#b83232;--green:#2d6a4f;--rule:#d4c4a8;--shadow:rgba(26,18,8,0.12);}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--paper);color:var(--ink);font-family:'Noto Serif TC',serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 20px 80px;position:relative;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(var(--rule) 1px,transparent 1px),linear-gradient(90deg,var(--rule) 1px,transparent 1px);background-size:40px 40px;opacity:0.3;pointer-events:none;}
.header{text-align:center;margin-bottom:48px;}
.header-badge{display:inline-block;background:var(--gold);color:white;font-size:11px;letter-spacing:3px;padding:4px 14px;margin-bottom:16px;font-family:'DM Mono',monospace;}
.header h1{font-size:clamp(28px,5vw,44px);font-weight:700;line-height:1.2;letter-spacing:-0.5px;}
.header h1 span{color:var(--gold);}
.header-sub{margin-top:10px;font-size:13px;color:#7a6a50;letter-spacing:1px;}
.divider{width:60px;height:3px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:20px auto 0;}
.search-card{background:white;border:1px solid var(--rule);border-radius:4px;padding:32px 36px;width:100%;max-width:480px;box-shadow:0 4px 24px var(--shadow);margin-bottom:36px;position:relative;}
.search-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--gold),var(--gold-light),var(--gold));border-radius:4px 4px 0 0;}
.search-label{display:block;font-size:12px;letter-spacing:2px;color:#7a6a50;margin-bottom:12px;}
.search-row{display:flex;gap:10px;}
.search-input{flex:1;border:1.5px solid var(--rule);border-radius:3px;padding:12px 16px;font-family:'DM Mono',monospace;font-size:18px;letter-spacing:2px;color:var(--ink);background:var(--paper);transition:border-color 0.2s;outline:none;}
.search-input:focus{border-color:var(--gold);background:white;}
.search-input::placeholder{color:#c4b49a;font-size:14px;letter-spacing:1px;}
.search-btn{background:var(--gold);color:white;border:none;border-radius:3px;padding:12px 22px;font-family:'Noto Serif TC',serif;font-size:15px;font-weight:600;cursor:pointer;transition:background 0.2s;white-space:nowrap;}
.search-btn:hover{background:#b07e12;}
.hint{margin-top:14px;font-size:12px;color:#a89878;font-family:'DM Mono',monospace;}
.result-card{background:white;border:1px solid var(--rule);border-radius:4px;width:100%;max-width:560px;box-shadow:0 6px 32px var(--shadow);overflow:hidden;animation:slideUp 0.35s ease;}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.result-header{background:var(--ink);color:white;padding:20px 28px;display:flex;align-items:center;justify-content:space-between;}
.student-name{font-size:22px;font-weight:700;letter-spacing:1px;}
.award-tag{display:inline-block;background:var(--gold-light);color:var(--ink);font-size:12px;padding:2px 8px;border-radius:3px;font-weight:600;letter-spacing:1px;margin-left:8px;vertical-align:middle;}
.student-meta{font-family:'DM Mono',monospace;font-size:12px;color:#c4b49a;margin-top:4px;letter-spacing:1px;}
.rank-badge{text-align:center;}
.rank-num{font-family:'DM Mono',monospace;font-size:42px;font-weight:500;color:var(--gold-light);line-height:1;}
.rank-label{font-size:11px;color:#a89878;letter-spacing:2px;margin-top:2px;}
.scores-section{padding:24px 28px;}
.section-title{font-size:11px;letter-spacing:3px;color:#7a6a50;margin-bottom:16px;display:flex;align-items:center;gap:10px;}
.section-title::after{content:'';flex:1;height:1px;background:var(--rule);}
.score-row{display:flex;align-items:center;padding:10px 0;border-bottom:1px solid #f0e8d8;}
.score-row:last-child{border-bottom:none;}
.score-subject{font-size:14px;font-weight:600;width:80px;flex-shrink:0;}
.score-bar-wrap{flex:1;height:8px;background:#f0e8d8;border-radius:4px;overflow:hidden;margin:0 16px;}
.score-bar{height:100%;border-radius:4px;}
.score-val{font-family:'DM Mono',monospace;font-size:15px;font-weight:500;width:52px;text-align:right;}
.total-row{margin-top:20px;background:var(--warm);border:1px solid var(--rule);border-radius:4px;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;}
.total-label{font-size:13px;font-weight:600;letter-spacing:1px;color:#5a4a30;}
.total-val{font-family:'DM Mono',monospace;font-size:20px;font-weight:500;color:var(--gold);}
.avg-row{margin-top:8px;display:flex;justify-content:space-between;padding:0 4px;}
.avg-label{font-size:12px;color:#7a6a50;}
.avg-val{font-family:'DM Mono',monospace;font-size:14px;color:#7a6a50;}
.compare-section{padding:16px 28px 24px;border-top:1px solid var(--rule);background:var(--paper);}
.compare-row{display:flex;align-items:center;gap:12px;margin-bottom:8px;font-size:13px;}
.compare-label{width:72px;color:#7a6a50;flex-shrink:0;}
.compare-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.improve-box{margin:0 28px 20px;background:linear-gradient(135deg,#fdf3e0,#fff8ec);border:1px solid #e8b84b;border-radius:6px;padding:14px 18px;display:flex;align-items:center;gap:12px;}
.improve-icon{font-size:24px;}
.improve-title{font-size:15px;font-weight:700;color:var(--gold);}
.improve-sub{font-size:12px;color:#7a6a50;margin-top:2px;}
.improve-num{font-family:'DM Mono',monospace;font-weight:700;color:var(--gold);}
.error-msg{background:#fff5f5;border:1px solid #f5c6c6;border-radius:4px;padding:16px 20px;color:var(--red);font-size:14px;text-align:center;width:100%;max-width:480px;}
.hidden{display:none;}
.footer{margin-top:60px;font-size:11px;color:#c4b49a;letter-spacing:2px;font-family:'DM Mono',monospace;}
</style>
</head>
<body>
<div class="header">
  <div class="header-badge">YONGPING ELEMENTARY</div>
  <h1>六〇三班<span>期末評量</span></h1>
  <p class="header-sub">114學年度 第二學期</p>
  <div class="divider"></div>
</div>
<div class="search-card">
  <label class="search-label" for="sid-input">請輸入孩子的學號</label>
  <div class="search-row">
    <input id="sid-input" class="search-input" type="text" placeholder="例：109000" maxlength="10" autocomplete="off"/>
    <button class="search-btn" onclick="lookup()">查詢</button>
  </div>
  <p class="hint">⚠️ 僅限家長使用，請查詢自己孩子的成績</p>
</div>
<div id="error-area" class="hidden"></div>
<div id="result-area" class="hidden"></div>
<div class="footer">603 HOMEROOM · 期末評量成績系統</div>
<script>
var students = [
  {seat:1, sid:"109379",name:"余相羽", chi:89,   eng:98,  mat:96,    soc:100, sci:94,   total:477,    rank:4,  award:null,    improve:0},
  {seat:2, sid:"109151",name:"廖宥誠", chi:93,   eng:98,  mat:96,    soc:98,  sci:91,   total:476,    rank:5,  award:"進步獎",improve:29.5},
  {seat:3, sid:"109382",name:"彭致皓", chi:99,   eng:100, mat:96,    soc:98,  sci:95,   total:488,    rank:1,  award:null,    improve:0},
  {seat:4, sid:"109225",name:"邢堉瑋", chi:98,   eng:100, mat:97.5,  soc:100, sci:92,   total:487.5,  rank:2,  award:null,    improve:0},
  {seat:5, sid:"109176",name:"潘韋辰", chi:92,   eng:98,  mat:87,    soc:96,  sci:94,   total:467,    rank:7,  award:null,    improve:0},
  {seat:6, sid:"109079",name:"張品維", chi:84,   eng:98,  mat:88,    soc:98,  sci:87,   total:455,    rank:12, award:null,    improve:0},
  {seat:7, sid:"109003",name:"鄧臣恩", chi:89,   eng:97,  mat:90,    soc:90,  sci:79,   total:445,    rank:14, award:null,    improve:0},
  {seat:8, sid:"109006",name:"歐其諺", chi:71,   eng:77,  mat:82.75, soc:88,  sci:72,   total:390.75, rank:17, award:null,    improve:0},
  {seat:9, sid:"109232",name:"周威辰", chi:43,   eng:20,  mat:28,    soc:44,  sci:51,   total:186,    rank:21, award:null,    improve:0},
  {seat:10,sid:"109111",name:"張晏綸", chi:89,   eng:94,  mat:96,    soc:92,  sci:95,   total:466,    rank:8,  award:null,    improve:0},
  {seat:11,sid:"109013",name:"許展銘", chi:74.5, eng:59,  mat:69.5,  soc:60,  sci:68,   total:331,    rank:19, award:null,    improve:0},
  {seat:12,sid:"109260",name:"張亦程", chi:85,   eng:98,  mat:94,    soc:92,  sci:85,   total:454,    rank:13, award:null,    improve:0},
  {seat:13,sid:"109288",name:"朱一",   chi:82.5, eng:87,  mat:80,    soc:96,  sci:83,   total:428.5,  rank:16, award:null,    improve:0},
  {seat:14,sid:"109297",name:"陳佳安", chi:96,   eng:98,  mat:94,    soc:100, sci:94,   total:482,    rank:3,  award:null,    improve:0},
  {seat:15,sid:"109097",name:"楊媛安", chi:88,   eng:88,  mat:92,    soc:100, sci:88,   total:456,    rank:11, award:"進步獎",improve:30},
  {seat:16,sid:"109346",name:"孫苡萱", chi:81.5, eng:60,  mat:24,    soc:86,  sci:75,   total:326.5,  rank:20, award:"進步獎",improve:58},
  {seat:17,sid:"109272",name:"馬靖耘", chi:95,   eng:90,  mat:92,    soc:100, sci:95,   total:472,    rank:6,  award:null,    improve:0},
  {seat:18,sid:"109423",name:"洪書琳", chi:96,   eng:95,  mat:92,    soc:96,  sci:85,   total:464,    rank:9,  award:null,    improve:0},
  {seat:19,sid:"109301",name:"楊宛霓", chi:98.5, eng:100, mat:91.5,  soc:100, sci:98,   total:488,    rank:1,  award:null,    improve:0},
  {seat:20,sid:"109248",name:"許芷瑄", chi:63.5, eng:54,  mat:66,    soc:96,  sci:75,   total:354.5,  rank:18, award:"進步獎",improve:87.5},
  {seat:21,sid:"109251",name:"劉芊妤", chi:90,   eng:96,  mat:98,    soc:98,  sci:95,   total:477,    rank:4,  award:null,    improve:0},
  {seat:22,sid:"109149",name:"柯瓔芮", chi:96,   eng:92,  mat:92,    soc:100, sci:92,   total:472,    rank:6,  award:null,    improve:0},
  {seat:23,sid:"109174",name:"高喬亘", chi:96,   eng:89,  mat:90,    soc:98,  sci:85,   total:458,    rank:10, award:null,    improve:0},
  {seat:24,sid:"109277",name:"陳巧庭", chi:91,   eng:88,  mat:79.5,  soc:96,  sci:77,   total:431.5,  rank:15, award:"進步獎",improve:48}
];

var classAvg = {chi:0,eng:0,mat:0,soc:0,sci:0,total:0};
students.forEach(function(s){
  classAvg.chi+=s.chi; classAvg.eng+=s.eng; classAvg.mat+=s.mat;
  classAvg.soc+=s.soc; classAvg.sci+=s.sci; classAvg.total+=s.total;
});
var n=students.length;
classAvg.chi/=n; classAvg.eng/=n; classAvg.mat/=n;
classAvg.soc/=n; classAvg.sci/=n; classAvg.total/=n;

function barColor(v){return v>=85?"#2d6a4f":v>=60?"#c9921a":"#b83232";}
function rankSuffix(r){return r===1?"🥇":r===2?"🥈":r===3?"🥉":"";}

function lookup(){
  var q=document.getElementById("sid-input").value.trim();
  var errArea=document.getElementById("error-area");
  var resArea=document.getElementById("result-area");
  errArea.className="hidden"; errArea.innerHTML="";
  resArea.className="hidden"; resArea.innerHTML="";
  if(!q) return;
  var s=null;
  for(var i=0;i<students.length;i++){if(students[i].sid===q){s=students[i];break;}}
  if(!s){
    errArea.innerHTML="<div class='error-msg'>找不到學號「"+q+"」的資料，請確認學號是否正確。</div>";
    errArea.className=""; return;
  }
  var subs=[
    {label:"國語",val:s.chi,avg:classAvg.chi},
    {label:"英語",val:s.eng,avg:classAvg.eng},
    {label:"數學",val:s.mat,avg:classAvg.mat},
    {label:"社會",val:s.soc,avg:classAvg.soc},
    {label:"自然",val:s.sci,avg:classAvg.sci}
  ];
  var scoreRows="";
  subs.forEach(function(sub){
    var c=barColor(sub.val);
    var display=Number.isInteger(sub.val)?sub.val:sub.val.toFixed(1);
    scoreRows+="<div class='score-row'>"+
      "<div class='score-subject'>"+sub.label+"</div>"+
      "<div class='score-bar-wrap'><div class='score-bar' style='width:"+sub.val+"%;background:"+c+"'></div></div>"+
      "<div class='score-val' style='color:"+c+"'>"+display+"</div>"+
      "</div>";
  });
  var compareRows="";
  subs.forEach(function(sub){
    var diff=(sub.val-sub.avg).toFixed(1);
    var up=parseFloat(diff)>=0;
    var color=up?"#2d6a4f":"#b83232";
    compareRows+="<div class='compare-row'>"+
      "<span class='compare-label'>"+sub.label+"</span>"+
      "<div class='compare-dot' style='background:"+color+"'></div>"+
      "<span style='font-family:DM Mono,monospace;font-size:13px;color:"+color+"'>"+(up?"+":"")+diff+" 較班平均</span>"+
      "</div>";
  });
  var td=(s.total-classAvg.total).toFixed(1);
  var tu=parseFloat(td)>=0;
  var tc=tu?"#2d6a4f":"#b83232";
  var compareTotal="<div class='compare-row' style='margin-top:10px;padding-top:10px;border-top:1px solid #e8dcc8'>"+
    "<span class='compare-label'>總分</span>"+
    "<div class='compare-dot' style='background:"+tc+"'></div>"+
    "<span style='font-family:DM Mono,monospace;font-size:13px;color:"+tc+"'>"+(tu?"+":"")+td+" 較班平均（"+classAvg.total.toFixed(1)+"）</span>"+
    "</div>";
  var awardTag=s.award?"<span class='award-tag'>🌟 "+s.award+"</span>":"";
  var improveBox="";
  if(s.award){
    improveBox="<div class='improve-box'>"+
      "<div class='improve-icon'>🌟</div>"+
      "<div><div style='font-size:12px;letter-spacing:2px;color:#7a6a50;margin-bottom:3px'>特別表現</div>"+
      "<div class='improve-title'>"+s.award+"</div>"+
      "<div class='improve-sub'>比期中評量進步了 <span class='improve-num'>+"+s.improve+"</span> 分，很棒喔！</div>"+
      "</div></div>";
  }
  var totalDisplay=Number.isInteger(s.total)?s.total:s.total.toFixed(1);
  resArea.innerHTML=
    "<div class='result-card'>"+
      "<div class='result-header'>"+
        "<div><div class='student-name'>"+s.name+" "+rankSuffix(s.rank)+awardTag+"</div>"+
        "<div class='student-meta'>學號 "+s.sid+"</div></div>"+
        "<div class='rank-badge'><div class='rank-num'>"+s.rank+"</div><div class='rank-label'>班級排名</div></div>"+
      "</div>"+
      "<div class='scores-section'>"+
        "<div class='section-title'>各科成績</div>"+
        scoreRows+
        "<div class='total-row'><span class='total-label'>總分</span><span class='total-val'>"+totalDisplay+"</span></div>"+
        "<div class='avg-row'><span class='avg-label'>總平均</span><span class='avg-val'>"+(s.total/5).toFixed(1)+"</span></div>"+
      "</div>"+
      "<div class='compare-section'>"+
        "<div class='section-title'>與班平均比較</div>"+
        compareRows+compareTotal+
      "</div>"+
      improveBox+
    "</div>";
  resArea.className="";
}
document.getElementById("sid-input").addEventListener("keydown",function(e){if(e.key==="Enter")lookup();});
</script>
</body>
</html>
