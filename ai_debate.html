<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 辯論賽 ⚔️ 603班</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #e63946;
    --blue: #1d3557;
    --gold: #f4a261;
    --light: #f1faee;
    --accent: #457b9d;
    --bg: #0d1b2a;
    --card: #1b2d3f;
    --border: #2a4a63;
    --green: #2ec4b6;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--bg);
    color: var(--light);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* BG pattern */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: 
      radial-gradient(ellipse at 20% 20%, rgba(230,57,70,0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 80%, rgba(69,123,157,0.1) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  .container { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: 24px 16px; }

  /* HEADER */
  header {
    text-align: center;
    padding: 32px 0 24px;
  }
  header .badge {
    display: inline-block;
    background: var(--red);
    color: white;
    font-size: 11px;
    font-weight: 900;
    letter-spacing: 3px;
    padding: 4px 14px;
    border-radius: 2px;
    margin-bottom: 12px;
    text-transform: uppercase;
  }
  header h1 {
    font-family: 'Black Han Sans', sans-serif;
    font-size: clamp(2.2rem, 7vw, 3.8rem);
    letter-spacing: 2px;
    line-height: 1;
    background: linear-gradient(135deg, #f1faee 30%, var(--gold));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  header p { color: #7a9bb5; margin-top: 10px; font-size: 0.95rem; }

  /* STEPS */
  .step-bar {
    display: flex;
    justify-content: center;
    gap: 0;
    margin: 24px 0;
    position: relative;
  }
  .step-bar::before {
    content: '';
    position: absolute;
    top: 18px;
    left: 50%;
    transform: translateX(-50%);
    width: 60%;
    height: 2px;
    background: var(--border);
  }
  .step {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    flex: 1;
    max-width: 100px;
    position: relative;
    z-index: 1;
  }
  .step-num {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: var(--card);
    border: 2px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 0.85rem;
    transition: all 0.3s;
  }
  .step.active .step-num { background: var(--red); border-color: var(--red); }
  .step.done .step-num { background: var(--green); border-color: var(--green); }
  .step-label { font-size: 0.72rem; color: #7a9bb5; text-align: center; }
  .step.active .step-label { color: var(--light); }

  /* SCREENS */
  .screen { display: none; }
  .screen.active { display: block; animation: fadeIn 0.4s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  /* CARD */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 20px;
  }
  .card h2 {
    font-size: 1rem;
    font-weight: 900;
    letter-spacing: 2px;
    color: var(--gold);
    margin-bottom: 16px;
    display: flex; align-items: center; gap: 8px;
  }

  /* INPUTS */
  input[type=text], textarea, select {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--light);
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 0.95rem;
    padding: 10px 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  input[type=text]:focus, textarea:focus, select:focus { border-color: var(--accent); }
  select option { background: var(--bg); }
  textarea { resize: vertical; min-height: 80px; }
  label { font-size: 0.85rem; color: #7a9bb5; display: block; margin-bottom: 6px; }

  /* BUTTONS */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 12px 28px;
    border: none; border-radius: 8px;
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 0.95rem; font-weight: 700;
    cursor: pointer; transition: all 0.2s;
  }
  .btn-primary { background: var(--red); color: white; }
  .btn-primary:hover { background: #c1121f; transform: translateY(-1px); }
  .btn-secondary { background: var(--accent); color: white; }
  .btn-secondary:hover { background: #356891; transform: translateY(-1px); }
  .btn-ghost { background: transparent; color: #7a9bb5; border: 1px solid var(--border); }
  .btn-ghost:hover { border-color: var(--accent); color: var(--light); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  .btn-row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 20px; }

  /* NUMBER INPUT */
  .num-row { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
  .num-btn {
    width: 38px; height: 38px;
    border-radius: 50%; border: none;
    background: var(--border); color: var(--light);
    font-size: 1.2rem; font-weight: 700;
    cursor: pointer; transition: background 0.2s;
  }
  .num-btn:hover { background: var(--accent); }
  .num-display {
    font-size: 2rem; font-weight: 900;
    min-width: 50px; text-align: center;
    color: var(--gold);
  }

  /* TOPIC PILLS */
  .topic-pills { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
  .pill {
    padding: 7px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: #a8c7e0;
    font-size: 0.82rem;
    cursor: pointer;
    transition: all 0.2s;
    user-select: none;
  }
  .pill:hover, .pill.selected { background: var(--accent); border-color: var(--accent); color: white; }

  /* GROUPS GRID */
  .groups-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .group-card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    position: relative;
  }
  .group-card .group-label {
    font-size: 0.75rem; font-weight: 900; letter-spacing: 2px;
    color: var(--gold); margin-bottom: 8px;
  }
  .group-card.has-content { border-color: var(--green); }
  .group-card .done-badge {
    position: absolute; top: 10px; right: 10px;
    width: 18px; height: 18px;
    background: var(--green); border-radius: 50%;
    display: none; align-items: center; justify-content: center;
    font-size: 0.65rem; color: white;
  }
  .group-card.has-content .done-badge { display: flex; }

  /* DEBATE DISPLAY */
  .vs-banner {
    display: flex; align-items: center; justify-content: center;
    gap: 16px; margin: 24px 0;
    font-family: 'Black Han Sans', sans-serif;
    font-size: clamp(1.2rem, 4vw, 2rem);
  }
  .vs-banner .side-label {
    padding: 8px 20px;
    border-radius: 8px;
    font-size: clamp(0.9rem, 2.5vw, 1.1rem);
    letter-spacing: 1px;
  }
  .side-label.pro { background: rgba(230,57,70,0.2); border: 1px solid var(--red); color: var(--red); }
  .side-label.con { background: rgba(69,123,157,0.2); border: 1px solid var(--accent); color: #a0c8e8; }
  .vs-text { color: var(--gold); font-size: 1.5em; }

  .debate-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
  @media (max-width: 600px) { .debate-cols { grid-template-columns: 1fr; } }

  .debate-col { border-radius: 10px; padding: 16px; }
  .debate-col.pro { background: rgba(230,57,70,0.08); border: 1px solid rgba(230,57,70,0.3); }
  .debate-col.con { background: rgba(69,123,157,0.08); border: 1px solid rgba(69,123,157,0.3); }
  .debate-col h3 { font-size: 0.85rem; font-weight: 900; letter-spacing: 2px; margin-bottom: 12px; }
  .debate-col.pro h3 { color: var(--red); }
  .debate-col.con h3 { color: #a0c8e8; }

  .argument-item {
    background: rgba(255,255,255,0.04);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 8px;
    font-size: 0.9rem;
    line-height: 1.6;
  }
  .argument-item .arg-source {
    font-size: 0.72rem; font-weight: 700; letter-spacing: 1px;
    margin-bottom: 4px; opacity: 0.7;
  }

  /* SCORING */
  .score-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .score-row .group-tag {
    background: var(--border); border-radius: 4px;
    padding: 3px 10px; font-size: 0.8rem; font-weight: 700;
    min-width: 60px; text-align: center;
  }
  .stars { display: flex; gap: 4px; }
  .star {
    font-size: 1.4rem; cursor: pointer;
    filter: grayscale(1) opacity(0.3);
    transition: all 0.15s;
    user-select: none;
  }
  .star.lit { filter: none; }
  .star:hover { transform: scale(1.2); }

  /* LOADING */
  .loading-overlay {
    display: none;
    position: fixed; inset: 0; z-index: 100;
    background: rgba(13,27,42,0.92);
    flex-direction: column;
    align-items: center; justify-content: center;
    gap: 20px;
  }
  .loading-overlay.show { display: flex; }
  .spinner {
    width: 48px; height: 48px;
    border: 4px solid var(--border);
    border-top-color: var(--red);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { color: #7a9bb5; font-size: 0.9rem; letter-spacing: 1px; }

  /* TOPIC DISPLAY */
  .topic-display {
    text-align: center;
    background: linear-gradient(135deg, rgba(230,57,70,0.1), rgba(69,123,157,0.1));
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 24px;
  }
  .topic-display .topic-label { font-size: 0.75rem; letter-spacing: 3px; color: var(--gold); margin-bottom: 8px; }
  .topic-display .topic-text { font-size: clamp(1.1rem, 3.5vw, 1.5rem); font-weight: 900; }

  .divider { border: none; border-top: 1px solid var(--border); margin: 24px 0; }

  .ai-tag {
    display: inline-flex; align-items: center; gap: 5px;
    background: rgba(244,162,97,0.15);
    border: 1px solid rgba(244,162,97,0.3);
    border-radius: 4px;
    padding: 2px 8px;
    font-size: 0.72rem; font-weight: 700; color: var(--gold);
    letter-spacing: 1px;
  }

  .summary-box {
    background: rgba(46,196,182,0.08);
    border: 1px solid rgba(46,196,182,0.3);
    border-radius: 10px;
    padding: 16px;
    margin-top: 16px;
  }
  .summary-box h3 { color: var(--green); font-size: 0.85rem; letter-spacing: 2px; margin-bottom: 10px; }
  .summary-box p { font-size: 0.9rem; line-height: 1.8; color: #c8dde8; }
</style>
</head>
<body>

<!-- LOADING -->
<div class="loading-overlay" id="loading">
  <div class="spinner"></div>
  <div class="loading-text">AI 正在思考中⋯</div>
</div>

<div class="container">
  <header>
    <div class="badge">603 班 × AI 課堂活動</div>
    <h1>⚔️ AI 辯論賽</h1>
    <p>各組先想論點，再看 AI 怎麼說！</p>
  </header>

  <!-- STEP BAR -->
  <div class="step-bar">
    <div class="step active" id="step1"><div class="step-num">1</div><div class="step-label">設定</div></div>
    <div class="step" id="step2"><div class="step-num">2</div><div class="step-label">各組論點</div></div>
    <div class="step" id="step3"><div class="step-num">3</div><div class="step-label">AI 辯論</div></div>
    <div class="step" id="step4"><div class="step-num">4</div><div class="step-label">評分</div></div>
  </div>

  <!-- SCREEN 1: SETUP -->
  <div class="screen active" id="screen1">
    <div class="card">
      <h2>📋 選擇辯論題目</h2>
      <label>內建題目（點選即填入）</label>
      <div class="topic-pills" id="topicPills"></div>
      <label style="margin-top:14px">或自訂題目</label>
      <input type="text" id="topicInput" placeholder="例：學生應該每天帶手機到校">
    </div>

    <div class="card">
      <h2>👥 設定組數</h2>
      <p style="font-size:0.85rem; color:#7a9bb5; margin-bottom:12px">每組分配正方或反方（可各半，或老師自由指定）</p>
      <div class="num-row">
        <button class="num-btn" onclick="changeGroups(-1)">−</button>
        <div class="num-display" id="groupCount">4</div>
        <button class="num-btn" onclick="changeGroups(1)">+</button>
        <span style="color:#7a9bb5; font-size:0.9rem">組</span>
      </div>
    </div>

    <div class="card" id="groupSetupCard">
      <h2>🏷️ 各組立場分配</h2>
      <div id="groupSetupList"></div>
    </div>

    <div class="btn-row">
      <button class="btn btn-primary" onclick="goToStep2()">開始 →</button>
    </div>
  </div>

  <!-- SCREEN 2: GROUP INPUT -->
  <div class="screen" id="screen2">
    <div class="topic-display">
      <div class="topic-label">辯論題目</div>
      <div class="topic-text" id="topicShow"></div>
    </div>

    <div class="card">
      <h2>💬 各組輸入論點</h2>
      <p style="font-size:0.85rem; color:#7a9bb5; margin-bottom:16px">每組提出 1–2 個最強論點，老師協助輸入後按「完成」</p>
      <div id="groupInputArea"></div>
    </div>

    <div class="btn-row">
      <button class="btn btn-ghost" onclick="goToStep(1)">← 返回</button>
      <button class="btn btn-primary" id="toAIBtn" onclick="goToStep3()">讓 AI 辯論 🤖</button>
    </div>
  </div>

  <!-- SCREEN 3: AI DEBATE -->
  <div class="screen" id="screen3">
    <div class="topic-display">
      <div class="topic-label">辯論題目</div>
      <div class="topic-text" id="topicShow3"></div>
    </div>

    <div class="vs-banner">
      <div class="side-label pro">✊ 正方</div>
      <div class="vs-text">VS</div>
      <div class="side-label con">🛡️ 反方</div>
    </div>

    <div class="debate-cols">
      <div class="debate-col pro">
        <h3>✊ 正方論點</h3>
        <div id="proStudentArgs"></div>
        <div style="margin: 12px 0 8px; display:flex; align-items:center; gap:8px;">
          <span class="ai-tag">🤖 AI 補充</span>
        </div>
        <div id="proAIArgs"></div>
      </div>
      <div class="debate-col con">
        <h3>🛡️ 反方論點</h3>
        <div id="conStudentArgs"></div>
        <div style="margin: 12px 0 8px; display:flex; align-items:center; gap:8px;">
          <span class="ai-tag">🤖 AI 補充</span>
        </div>
        <div id="conAIArgs"></div>
      </div>
    </div>

    <div class="summary-box" id="summaryBox" style="display:none">
      <h3>🔍 AI 觀察</h3>
      <p id="summaryText"></p>
    </div>

    <div class="btn-row" style="margin-top:24px">
      <button class="btn btn-ghost" onclick="goToStep(2)">← 返回</button>
      <button class="btn btn-secondary" onclick="goToStep4()">評分環節 ⭐</button>
    </div>
  </div>

  <!-- SCREEN 4: SCORING -->
  <div class="screen" id="screen4">
    <div class="card">
      <h2>⭐ 全班投票評分</h2>
      <p style="font-size:0.85rem; color:#7a9bb5; margin-bottom:16px">老師帶全班評分：哪組論點最有說服力？（1–5顆星）</p>
      <div id="scoreList"></div>
    </div>

    <div class="card">
      <h2>🏆 結果</h2>
      <div id="resultArea" style="text-align:center; padding: 20px 0;">
        <button class="btn btn-primary" onclick="showResults()">計算結果 🎉</button>
      </div>
    </div>

    <div class="btn-row">
      <button class="btn btn-ghost" onclick="goToStep(3)">← 返回</button>
      <button class="btn btn-secondary" onclick="resetAll()">🔄 再玩一次</button>
    </div>
  </div>

</div>

<script>
const TOPICS = [
  "學生應該每天帶手機到學校",
  "學校應該取消回家作業",
  "電動遊戲對學生有益",
  "學校午餐應該全面素食化",
  "學生應該自己選擇要上哪些課",
  "動物不應該關在動物園裡",
  "人工智慧（AI）會讓人類變懶",
  "學生應該穿制服上學",
];

let groupCount = 4;
let groups = [];
let topic = '';
let aiResult = null;

// Init topic pills
const pillContainer = document.getElementById('topicPills');
TOPICS.forEach(t => {
  const pill = document.createElement('div');
  pill.className = 'pill';
  pill.textContent = t;
  pill.onclick = () => {
    document.querySelectorAll('.pill').forEach(p => p.classList.remove('selected'));
    pill.classList.add('selected');
    document.getElementById('topicInput').value = t;
  };
  pillContainer.appendChild(pill);
});

function changeGroups(delta) {
  groupCount = Math.max(2, Math.min(8, groupCount + delta));
  document.getElementById('groupCount').textContent = groupCount;
  renderGroupSetup();
}

function renderGroupSetup() {
  const list = document.getElementById('groupSetupList');
  list.innerHTML = '';
  for (let i = 0; i < groupCount; i++) {
    const side = groups[i]?.side || (i % 2 === 0 ? 'pro' : 'con');
    const name = groups[i]?.name || `第 ${i+1} 組`;
    list.innerHTML += `
      <div style="display:flex; align-items:center; gap:10px; margin-bottom:10px; flex-wrap:wrap;">
        <input type="text" style="width:120px; flex:0 0 120px;" value="${name}" id="gname${i}" placeholder="組名">
        <label style="display:flex; align-items:center; gap:6px; margin:0; cursor:pointer;">
          <input type="radio" name="side${i}" value="pro" ${side==='pro'?'checked':''} onchange="updateGroupSide(${i},'pro')">
          <span style="color:var(--red); font-weight:700;">✊ 正方</span>
        </label>
        <label style="display:flex; align-items:center; gap:6px; margin:0; cursor:pointer;">
          <input type="radio" name="side${i}" value="con" ${side==='con'?'checked':''} onchange="updateGroupSide(${i},'con')">
          <span style="color:#a0c8e8; font-weight:700;">🛡️ 反方</span>
        </label>
      </div>`;
  }
}

function updateGroupSide(i, side) {
  if (groups[i]) groups[i].side = side;
}

renderGroupSetup();

function goToStep2() {
  topic = document.getElementById('topicInput').value.trim();
  if (!topic) { alert('請先輸入或選擇辯論題目！'); return; }
  groups = [];
  for (let i = 0; i < groupCount; i++) {
    const name = document.getElementById(`gname${i}`)?.value || `第${i+1}組`;
    const side = document.querySelector(`input[name="side${i}"]:checked`)?.value || (i%2===0?'pro':'con');
    groups.push({ name, side, args: '' });
  }
  document.getElementById('topicShow').textContent = topic;
  renderGroupInputs();
  goToStep(2);
}

function renderGroupInputs() {
  const area = document.getElementById('groupInputArea');
  area.innerHTML = '';
  groups.forEach((g, i) => {
    area.innerHTML += `
      <div class="group-card" id="gc${i}">
        <div class="done-badge">✓</div>
        <div class="group-label">${g.name} — ${g.side==='pro'?'✊ 正方':'🛡️ 反方'}</div>
        <textarea id="gargs${i}" placeholder="輸入論點（可用換行分隔多個論點）" rows="3"
          oninput="updateGroupArgs(${i})">${g.args}</textarea>
      </div>`;
  });
}

function updateGroupArgs(i) {
  groups[i].args = document.getElementById(`gargs${i}`).value;
  const card = document.getElementById(`gc${i}`);
  if (groups[i].args.trim()) card.classList.add('has-content');
  else card.classList.remove('has-content');
}

async function goToStep3() {
  document.getElementById('topicShow3').textContent = topic;

  // Build student args display
  const proGroups = groups.filter(g => g.side === 'pro');
  const conGroups = groups.filter(g => g.side === 'con');

  const buildStudentHTML = (gs) => gs.map(g => `
    <div class="argument-item">
      <div class="arg-source">${g.name}</div>
      ${g.args.trim() ? g.args.split('\n').filter(l=>l.trim()).map(l=>`<div>• ${l}</div>`).join('') : '<div style="opacity:0.4">（未輸入論點）</div>'}
    </div>`).join('');

  document.getElementById('proStudentArgs').innerHTML = buildStudentHTML(proGroups);
  document.getElementById('conStudentArgs').innerHTML = buildStudentHTML(conGroups);

  goToStep(3);
  document.getElementById('proAIArgs').innerHTML = '<div style="color:#7a9bb5; font-size:0.85rem;">載入中⋯</div>';
  document.getElementById('conAIArgs').innerHTML = '<div style="color:#7a9bb5; font-size:0.85rem;">載入中⋯</div>';
  document.getElementById('summaryBox').style.display = 'none';

  document.getElementById('loading').classList.add('show');

  const prompt = `你是一位辯論教練，正在幫助小學六年級學生學習辯論。

辯論題目：「${topic}」

學生正方論點：
${proGroups.map(g => g.args.trim() || '（無）').join('\n')}

學生反方論點：
${conGroups.map(g => g.args.trim() || '（無）').join('\n')}

請用繁體中文，以 JSON 格式回覆，包含以下欄位：
- pro_args: 陣列，3個正方論點（每個約30字，語言簡單易懂，適合六年級學生）
- con_args: 陣列，3個反方論點（同上）
- summary: 字串，約80字的觀察：哪一方論點更有說服力？同學有沒有想到 AI 沒想到的論點？語氣輕鬆有趣，適合課堂分享。

只回覆 JSON，不要有其他文字。`;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        messages: [{ role: 'user', content: prompt }]
      })
    });
    const data = await res.json();
    const text = data.content.map(i => i.text || '').join('');
    const clean = text.replace(/```json|```/g, '').trim();
    aiResult = JSON.parse(clean);

    document.getElementById('proAIArgs').innerHTML = aiResult.pro_args.map(a =>
      `<div class="argument-item">• ${a}</div>`).join('');
    document.getElementById('conAIArgs').innerHTML = aiResult.con_args.map(a =>
      `<div class="argument-item">• ${a}</div>`).join('');
    document.getElementById('summaryText').textContent = aiResult.summary;
    document.getElementById('summaryBox').style.display = 'block';
  } catch(e) {
    document.getElementById('proAIArgs').innerHTML = '<div style="color:var(--red)">載入失敗，請重試</div>';
    document.getElementById('conAIArgs').innerHTML = '<div style="color:var(--red)">載入失敗，請重試</div>';
  }

  document.getElementById('loading').classList.remove('show');
}

function goToStep4() {
  const list = document.getElementById('scoreList');
  list.innerHTML = '';
  groups.forEach((g, i) => {
    const sideLabel = g.side === 'pro' ? '<span style="color:var(--red)">✊ 正方</span>' : '<span style="color:#a0c8e8">🛡️ 反方</span>';
    list.innerHTML += `
      <div class="score-row">
        <div class="group-tag">${g.name}</div>
        <div style="font-size:0.8rem; color:#7a9bb5;">${sideLabel}</div>
        <div class="stars" id="stars${i}">
          ${[1,2,3,4,5].map(n => `<span class="star" data-g="${i}" data-v="${n}" onclick="setStar(${i},${n})">★</span>`).join('')}
        </div>
        <span id="scoreVal${i}" style="color:var(--gold); font-weight:700; font-size:0.9rem;"></span>
      </div>`;
  });
  goToStep(4);
}

const scores = {};
function setStar(g, v) {
  scores[g] = v;
  document.querySelectorAll(`.star[data-g="${g}"]`).forEach(s => {
    s.classList.toggle('lit', parseInt(s.dataset.v) <= v);
  });
  document.getElementById(`scoreVal${g}`).textContent = `${v} 分`;
}

function showResults() {
  let sorted = groups.map((g, i) => ({ ...g, score: scores[i] || 0 }))
    .sort((a, b) => b.score - a.score);
  const winner = sorted[0];
  document.getElementById('resultArea').innerHTML = `
    <div style="font-size:3rem; margin-bottom:8px;">🏆</div>
    <div style="font-size:1.4rem; font-weight:900; color:var(--gold); margin-bottom:8px;">${winner.name} 獲勝！</div>
    <div style="color:#7a9bb5; font-size:0.9rem; margin-bottom:20px;">${winner.score} 分 · ${winner.side==='pro'?'✊ 正方':'🛡️ 反方'}</div>
    <div style="display:flex; flex-direction:column; gap:8px; max-width:300px; margin:0 auto;">
      ${sorted.map((g,i) => `
        <div style="display:flex; justify-content:space-between; align-items:center; background:var(--bg); padding:8px 14px; border-radius:8px; border:1px solid var(--border);">
          <span>${i===0?'🥇':i===1?'🥈':'🥉'} ${g.name}</span>
          <span style="color:var(--gold); font-weight:700;">${g.score || 0} 分</span>
        </div>`).join('')}
    </div>`;
}

function resetAll() {
  topic = ''; aiResult = null; groups = [];
  document.getElementById('topicInput').value = '';
  document.querySelectorAll('.pill').forEach(p => p.classList.remove('selected'));
  goToStep(1);
}

function goToStep(n) {
  document.querySelectorAll('.screen').forEach((s,i) => s.classList.toggle('active', i===n-1));
  document.querySelectorAll('.step').forEach((s,i) => {
    s.classList.toggle('active', i===n-1);
    s.classList.toggle('done', i<n-1);
  });
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
</script>
</body>
</html>
